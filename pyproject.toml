[project]
name = "group-travel-agent"
version = "0.1.0"
description = "Agentic group travel planner — finds cheapest destination for multi-origin groups"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "amadeus>=12.0.0",
    "anthropic>=0.100.0",
    "chromadb>=1.5.9",
    "dspy>=3.2.1",
    "httpx>=0.28.1",
    "langchain-anthropic>=1.4.3",
    "langchain-cloudflare>=0.3.4",
    "langchain-core>=1.3.3",
    "langchain-deepseek>=1.0.1",
    "langchain-groq>=1.1.2",
    "langchain-openai>=1.2.1",
    "langgraph>=1.1.10",
    "langsmith>=0.8.3",
    "pytest>=9.0.3",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "tenacity>=9.1.4",
    "typer>=0.25.1",
]
[project.scripts]
travel = "src.cli:main"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
